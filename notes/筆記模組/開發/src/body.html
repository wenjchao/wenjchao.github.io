<div id="app">
  <header id="topbar">
    <button class="icon-btn" id="railToggle" title="模組列表" aria-label="模組列表">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#" id="brand" title="回到首頁">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><rect x="7" y="9" width="10" height="8" rx="2"/><path d="M7 6.5h6"/></svg>
      <span>筆記模組</span>
    </a>
    <span class="spacer"></span>
    <div id="status"><span class="dot"></span><span class="txt">尚未載入</span></div>
    <details class="menu" id="srcMenu">
      <summary class="btn" id="srcBtn">匯入 ▾</summary>
      <div class="menu-pop" id="srcPop"></div>
    </details>
    <select id="styleSel" class="sel" title="外觀樣式" aria-label="外觀樣式"></select>
    <button class="icon-btn" id="themeBtn" title="切換深淺色" aria-label="切換深淺色">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>
    </button>
  </header>

  <aside id="rail">
    <div class="rail-search"><input id="search" type="search" placeholder="搜尋模組　／" autocomplete="off" spellcheck="false"></div>
    <nav id="list" aria-label="模組列表"></nav>
    <div id="railStatus" class="rail-status"></div>
    <div class="rail-foot">
      <span id="count"></span>
      <a class="btn warn-btn" id="linksBtn" href="#/__links" hidden></a>
      <span class="spacer"></span>
      <button class="btn" id="newBtn" hidden>＋ 新增模組</button>
    </div>
  </aside>
  <div id="scrim"></div>

  <main id="main"><div id="notice" class="notice" hidden></div><div class="page" id="page"></div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="pickFiles" multiple accept=".md,.markdown,.txt,image/*" hidden>
<input type="file" id="pickDir" webkitdirectory hidden>
<!-- @modules -->
